name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Build and publish Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: long-compress-assistant
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: long-compress-assistant/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify release version identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nodeVersions = node -e "const p=require('./package.json');const l=require('./package-lock.json');const t=require('./src-tauri/tauri.conf.json');process.stdout.write(JSON.stringify([p.version,l.version,l.packages[''].version,t.package.version]))" | ConvertFrom-Json
          $cargo = Get-Content -LiteralPath 'src-tauri/Cargo.toml' -Raw
          $cargoLock = Get-Content -LiteralPath 'src-tauri/Cargo.lock' -Raw
          $shellCargo = Get-Content -LiteralPath 'src-tauri/shell-extension/Cargo.toml' -Raw
          $shellCargoLock = Get-Content -LiteralPath 'src-tauri/shell-extension/Cargo.lock' -Raw
          $cargoVersion = [regex]::Match($cargo, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          $cargoLockVersion = [regex]::Match(
            $cargoLock,
            '(?ms)\[\[package\]\]\s+name = "long-compress-assistant"\s+version = "([^"]+)"'
          ).Groups[1].Value
          $shellVersion = [regex]::Match($shellCargo, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          $shellLockVersion = [regex]::Match(
            $shellCargoLock,
            '(?ms)\[\[package\]\]\s+name = "long-compress-shell-extension"\s+version = "([^"]+)"'
          ).Groups[1].Value
          $versions = @(
            $nodeVersions[0],
            $nodeVersions[1],
            $nodeVersions[2],
            $nodeVersions[3],
            $cargoVersion,
            $cargoLockVersion,
            $shellVersion,
            $shellLockVersion
          )
          if (@($versions | Select-Object -Unique).Count -ne 1) {
            throw "Release version sources disagree: $($versions -join ', ')"
          }
          $expectedTag = "v$($nodeVersions[0])"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match application version $expectedTag."
          }
          $shellResource = "src-tauri/resources/long_compress_shell_extension_$($nodeVersions[0].Replace('.', '_')).dll"
          if (-not (Test-Path -LiteralPath $shellResource)) {
            throw "Versioned shell extension is missing: $shellResource"
          }
          Write-Host "Release identity verified: $expectedTag"
      - run: npm ci
      - run: npm run type-check
      - run: npm run test:unit
      - run: cargo test --release --manifest-path src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: long-compress-assistant
          tagName: v__VERSION__
          releaseName: Long解压 v__VERSION__
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          assetNamePattern: Long-Decompress_[version]_[arch][setup][ext]
          args: --bundles nsis,updater
      - name: Confirm Windows 11 identity packages were skipped
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @(
            'src-tauri/resources/long_compress_context_menu_extract.msix',
            'src-tauri/resources/long_compress_context_menu_pack.msix'
          )
          if (@($packages | Where-Object { Test-Path -LiteralPath $_ }).Count -gt 0) {
            throw 'Unsigned releases must not contain Windows 11 context-menu identity packages.'
          }
          Write-Host 'Windows 11 identity packages skipped: no production code-signing certificate is configured.'
      - name: Verify and publish updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content -LiteralPath 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $version = $config.package.version
          $tag = "v$version"
          $release = gh api "repos/${{ github.repository }}/releases/tags/$tag" | ConvertFrom-Json
          $zipAsset = $release.assets | Where-Object { $_.name -like '*.nsis.zip' } | Select-Object -First 1
          $signatureFile = Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' -Filter '*.nsis.zip.sig' | Select-Object -First 1
          if (-not $zipAsset -or -not $signatureFile) {
            throw 'Updater ZIP or signature was not produced.'
          }

          $signature = (Get-Content -LiteralPath $signatureFile.FullName -Raw).Trim()
          $notes = if ($release.body) { $release.body } else { "Long解压 $version 更新" }
          $manifest = [ordered]@{
            version = $version
            notes = $notes
            pub_date = $release.published_at
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = $signature
                url = $zipAsset.browser_download_url
              }
            }
          }
          $manifestPath = Join-Path $env:RUNNER_TEMP 'latest.json'
          [IO.File]::WriteAllText(
            $manifestPath,
            ($manifest | ConvertTo-Json -Depth 5),
            [Text.UTF8Encoding]::new($false)
          )
          gh release upload $tag $manifestPath --clobber

          $published = Invoke-RestMethod "https://github.com/${{ github.repository }}/releases/download/$tag/latest.json"
          if ($published.version -ne $version -or -not $published.platforms.'windows-x86_64'.signature) {
            throw 'Published updater manifest failed validation.'
          }
