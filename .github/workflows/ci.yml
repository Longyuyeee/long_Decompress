name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  rust-check:
    name: Rust Check (lib)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: long-compress-assistant/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: long-compress-assistant/src-tauri

      - name: Install Linux deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: cargo check --lib
        run: cargo check --lib

  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: long-compress-assistant/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: long-compress-assistant/src-tauri

      - name: Install Linux deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Run integration tests
        run: |
          cargo test --test compression_capabilities_regression
          cargo test --test fixes_validation_test
          cargo test --test split_compression_test
          cargo test --test rar_support_test
          cargo test --test password_zip_test
          cargo test --test zip_compression_test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: long-compress-assistant
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: long-compress-assistant/package-lock.json

      - run: npm ci
      - run: npx vite build
