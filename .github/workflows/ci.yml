name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Windows package
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: long-compress-assistant
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: long-compress-assistant/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            long-compress-assistant/src-tauri -> target
            long-compress-assistant/src-tauri/shell-extension -> target
      - run: npm ci
      - name: Verify version identity
        run: npm run test:release-identity
      - name: Build unsigned NSIS installer
        run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v6
        with:
          name: windows-nsis-installer
          path: long-compress-assistant/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
