name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend checks
    runs-on: windows-latest
    defaults:
      run:
        working-directory: long-compress-assistant
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: long-compress-assistant/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run test:unit:coverage
      - run: npm run build

  rust:
    name: Rust and shell-extension checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            long-compress-assistant/src-tauri -> target
            long-compress-assistant/src-tauri/shell-extension -> target
      - name: Test Tauri backend
        working-directory: long-compress-assistant/src-tauri
        run: cargo test --release --all-targets
      - name: Lint Tauri backend
        working-directory: long-compress-assistant/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Test Windows shell extension
        working-directory: long-compress-assistant/src-tauri/shell-extension
        run: cargo test --release
      - name: Lint Windows shell extension
        working-directory: long-compress-assistant/src-tauri/shell-extension
        run: cargo clippy --all-targets -- -D warnings

  e2e:
    name: Browser shell E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: long-compress-assistant
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: long-compress-assistant/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium

  desktop-e2e:
    name: Windows desktop E2E
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: long-compress-assistant
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: long-compress-assistant/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: long-compress-assistant/src-tauri -> target
      - run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Build real Tauri application
        working-directory: long-compress-assistant/src-tauri
        run: cargo build --release --features custom-protocol,desktop-e2e
      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.0.6 --locked
      - name: Install matching Microsoft EdgeDriver
        run: |
          $driver = & .\scripts\install-edge-driver.ps1 -Destination (Join-Path $env:RUNNER_TEMP "edge-driver")
          "EDGE_DRIVER_PATH=$driver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run real Windows desktop smoke test
        run: npm run test:e2e:desktop
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: windows-desktop-e2e-failure
          path: long-compress-assistant/test-results/desktop-e2e/
          if-no-files-found: ignore
          retention-days: 7

  installer:
    name: Windows installer
    needs: [frontend, rust, e2e, desktop-e2e]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: long-compress-assistant
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: long-compress-assistant/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            long-compress-assistant/src-tauri -> target
            long-compress-assistant/src-tauri/shell-extension -> target
      - run: npm ci
      - name: Build unsigned NSIS installer
        run: |
          $exitCode = 1
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm run tauri build -- --bundles nsis
            $exitCode = $LASTEXITCODE
            if ($exitCode -eq 0) {
              exit 0
            }
            if ($attempt -lt 3) {
              $delay = 15 * $attempt
              Write-Warning "NSIS build attempt $attempt failed; retrying in $delay seconds."
              Start-Sleep -Seconds $delay
            }
          }
          exit $exitCode
      - uses: actions/upload-artifact@v6
        with:
          name: windows-nsis-installer
          path: long-compress-assistant/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
