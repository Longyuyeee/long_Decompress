name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend checks
    runs-on: windows-latest
    defaults:
      run:
        working-directory: long-compress-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: long-compress-assistant/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run test:unit:coverage
      - run: npm run build

  rust:
    name: Rust and shell-extension checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            long-compress-assistant/src-tauri -> target
            long-compress-assistant/src-tauri/shell-extension -> target
      - name: Test Tauri backend
        working-directory: long-compress-assistant/src-tauri
        run: cargo test --release --all-targets
      - name: Lint Tauri backend
        working-directory: long-compress-assistant/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Test Windows shell extension
        working-directory: long-compress-assistant/src-tauri/shell-extension
        run: cargo test --release
      - name: Lint Windows shell extension
        working-directory: long-compress-assistant/src-tauri/shell-extension
        run: cargo clippy --all-targets -- -D warnings

  e2e:
    name: Browser shell E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: long-compress-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: long-compress-assistant/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium

  installer:
    name: Windows installer
    needs: [frontend, rust, e2e]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: long-compress-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: long-compress-assistant/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build unsigned NSIS installer
        run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-installer
          path: long-compress-assistant/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
