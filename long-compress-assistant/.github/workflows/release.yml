name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}

    steps:
    - name: Get version from tag
      id: get_version
      run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref_name }}
        body: |
          ## 胧解压助手 ${{ github.ref_name }}

          ### 下载
          - Windows: `long-compress-assistant_${{ steps.get_version.outputs.version }}_x64_en-US.msi`

          ### 更新内容
          请查看提交历史了解详细更新内容。

          ### 系统要求
          - Windows 10/11 (64-bit)
          - .NET Framework 4.7.2 或更高版本
        draft: false
        prerelease: false

  build-windows:
    name: Build Windows
    needs: create-release
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Tauri app
      run: npm run tauri build

    - name: Upload MSI installer
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./src-tauri/target/release/bundle/msi/long-compress-assistant_${{ needs.create-release.outputs.version }}_x64_en-US.msi
        asset_name: long-compress-assistant_${{ needs.create-release.outputs.version }}_x64_en-US.msi
        asset_content_type: application/x-msi

    - name: Upload NSIS installer
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./src-tauri/target/release/bundle/nsis/long-compress-assistant_${{ needs.create-release.outputs.version }}_x64-setup.exe
        asset_name: long-compress-assistant_${{ needs.create-release.outputs.version }}_x64-setup.exe
        asset_content_type: application/x-msdownload

  build-linux:
    name: Build Linux
    needs: create-release
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Tauri app
      run: npm run tauri build

    - name: Upload AppImage
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./src-tauri/target/release/bundle/appimage/long-compress-assistant_${{ needs.create-release.outputs.version }}_amd64.AppImage
        asset_name: long-compress-assistant_${{ needs.create-release.outputs.version }}_amd64.AppImage
        asset_content_type: application/x-executable

    - name: Upload Debian package
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./src-tauri/target/release/bundle/deb/long-compress-assistant_${{ needs.create-release.outputs.version }}_amd64.deb
        asset_name: long-compress-assistant_${{ needs.create-release.outputs.version }}_amd64.deb
        asset_content_type: application/vnd.debian.binary-package

  build-macos:
    name: Build macOS
    needs: create-release
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        target: aarch64-apple-darwin

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Tauri app (Intel)
      run: npm run tauri build

    - name: Build Tauri app (Apple Silicon)
      run: npm run tauri build -- --target aarch64-apple-darwin

    - name: Upload DMG (Intel)
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./src-tauri/target/release/bundle/dmg/long-compress-assistant_${{ needs.create-release.outputs.version }}_x64.dmg
        asset_name: long-compress-assistant_${{ needs.create-release.outputs.version }}_x64.dmg
        asset_content_type: application/x-apple-diskimage

    - name: Upload DMG (Apple Silicon)
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/long-compress-assistant_${{ needs.create-release.outputs.version }}_aarch64.dmg
        asset_name: long-compress-assistant_${{ needs.create-release.outputs.version }}_aarch64.dmg
        asset_content_type: application/x-apple-diskimage
