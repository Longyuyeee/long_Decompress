[package]
name = "long-egg"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
unegg = { path = "../../vendor/unegg" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"
encoding_rs = "0.8"

[profile.release]
strip = true
lto = true
codegen-units = 1
