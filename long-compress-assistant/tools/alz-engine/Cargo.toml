[package]
name = "long-alz"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
unalz = { path = "../../vendor/unalz" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
crc32fast = "1"
flate2 = "1"
wildmatch = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
